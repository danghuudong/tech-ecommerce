services:
  - type: web
    name: tech-ecommerce-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack pnpm install --frozen-lockfile --no-prod --filter server... && corepack pnpm --filter server build
    startCommand: corepack pnpm --filter server start:render
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off'
    buildFilter:
      paths:
        - server/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tech-ecommerce-redis
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: API_PROXY_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: ORDER_BANK_NAME
        sync: false
      - key: ORDER_BANK_ACCOUNT_NUMBER
        sync: false
      - key: ORDER_BANK_ACCOUNT_HOLDER
        sync: false
      - key: ORDER_DEMO_BANK_TRANSFER_ENABLED
        sync: false
      - key: ORDER_DEMO_BANK_TRANSFER_ALLOW_PRODUCTION
        sync: false

  - type: keyvalue
    name: tech-ecommerce-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
